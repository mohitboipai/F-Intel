<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F-Intel Sell Signal Backtest Report</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Inter, system-ui, sans-serif;
    background: #0d0d1e;
    color: #e0e0e0;
    padding: 24px;
    font-size: 13px;
  }
  h1 { color: #4fc3f7; font-size: 22px; margin-bottom: 4px; letter-spacing: 1px; }
  .subtitle { color: #888; font-size: 12px; margin-bottom: 20px; }
  .card {
    background: #12122a;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .section-title {
    color: #4fc3f7;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .metrics-row {
    display: flex; flex-wrap: wrap; gap: 14px;
  }
  .metric-card {
    background: linear-gradient(135deg, #1a1a35 0%, #0f0f23 100%);
    border: 1px solid #2a2a44;
    border-radius: 8px;
    padding: 16px 20px;
    min-width: 140px;
    flex: 1;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: transform 0.2s;
  }
  .metric-card:hover {
    transform: translateY(-2px);
  }
  .metric-label { color: #888; font-size: 11px; text-transform: uppercase; margin-bottom: 6px; }
  .metric-value { font-size: 20px; font-weight: 700; }
  .kelly-box {
    margin-top: 16px;
    padding: 10px 14px;
    background: #0a1a2a;
    border-left: 3px solid #4fc3f7;
    border-radius: 4px;
    color: #ccc;
    font-size: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 4px;
  }
  th {
    color: #888;
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid #2a2a4a;
    white-space: nowrap;
  }
  td {
    padding: 6px 10px;
    border-bottom: 1px solid #1a1a35;
    white-space: nowrap;
  }
  tr:hover td { background: #1a1a35; }
  
  .table-row-credit { background-color: rgba(102, 187, 106, 0.05); }
  .table-row-debit { background-color: rgba(255, 68, 68, 0.05); }
  
</style>
</head>
<body>
<h1>⚡ F-Intel Sell Signal Backtest Report</h1>
<div class="subtitle">Generated: 2026-04-24 12:48 | NIFTY Options | Lot Size: 65 | Risk-Free: 7%</div>
<div class="card"><p style="color:#888">No trades found in database.</p></div>
</body>
</html>
